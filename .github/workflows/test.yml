  #       uses: actions/setup-go@v5
  #       with:
  #         go-version: 1.26

  #     - name: Check out code into the Go module directory
  #       uses: actions/checkout@v4

  #     - name: Run vet
  #       run: go vet ./...

  #     - name: Test
  #       run: go test --mode=unit -v ./...
  go_tests_linux_latest:
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26

      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Run vet
        shell: bash
        run: go vet -structtag=false ./...

      - name: Test
        run: go test --mode=unit -v ./...
  go_tests:
    runs-on: windows-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25

      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Run vet
        shell: bash
        run: go vet -structtag=false ./...

      - name: Test
        run: go test --mode=unit -v ./...
  go_tests_mac:
    # TODO: Change to macos-latest once hanging issue is resolved.
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25

      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Run vet
        shell: bash
        run: go vet -structtag=false ./...

      - name: Test
        run: go test --mode=unit -v ./...
  go_tests_linux:
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25

      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Run vet
        shell: bash
        run: go vet -structtag=false ./...

      - name: Test
        run: go test --mode=unit -v ./...
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install golangci-lint
        # Build from source: the prebuilt v1.64.8 binary uses Go 1.24 and rejects go 1.25 modules.
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - name: Run golangci-lint
        run: golangci-lint run --max-same-issues 0 --out-format colored-line-number --exclude-dirs="examples,interactions.*,internal.*"
