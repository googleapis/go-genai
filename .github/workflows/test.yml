name: Go Tests
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
env:
  SPEAKEASY_VERSION: v2.960.7
jobs:
  go_tests_latest:
    runs-on: windows-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26

      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Run vet
        shell: bash
        run: go vet -structtag=false ./...

      - name: Test
        run: go test --mode=unit -v ./...
